[pytest]
testpaths = tests
# XSD conformance needs the normative OMG schemas on disk (scripts/fetch_schemas.py)
# and is therefore opt-in via --xsd-dir; the default run stays offline.
addopts =
    -q
    --cov
    --cov-report=term-missing
    --cov-report=html:coverage-html
    --cov-report=xml:coverage.xml
    --alluredir=allure-results
    --clean-alluredir
